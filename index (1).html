<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Prathyusha 🎉</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="confetti"></canvas>

<audio id="music" autoplay loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<div class="container">
  <h1 class="typewriter">🎉 Happy Birthday Prathyusha 💙</h1>

  <!-- Cake -->
  <div class="cake">
    <div class="candle">
      <div class="flame"></div>
    </div>
  </div>
  <p class="hint">Tap the flame to blow the candle 🕯️</p>

  <!-- Slideshow -->
  <div class="slideshow">
    <img src="images/pic1.jpg" class="slide active">
    <img src="images/pic2.jpg" class="slide">
    <img src="images/pic3.jpg" class="slide">
  </div>

  <p class="message">
    May your life be filled with happiness, success, and endless smiles.
    You are truly special 💖
  </p>
</div>

<script src="script.js"></script>
</body>
</html>
